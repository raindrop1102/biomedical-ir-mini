name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # nltk: test-only Porter reference. numpy / matplotlib / flask: the optional embed, plot and web parts,
      # installed so their tests run instead of being skipped. Search and Zipf statistics need none of them.
      - run: python -m pip install nltk==3.9.1 numpy matplotlib flask
      - run: python -m unittest discover tests -v

  # Starts the site exactly as Render does (requirements.txt, .python-version and render.yaml's
  # startCommand) and requests every page, so a broken deployment fails here first.
  deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements.txt
      - name: Serve with render.yaml's start command and request every page
        env:
          PORT: 8000
          MPLBACKEND: Agg
        run: |
          start=$(sed -n 's/^ *startCommand: //p' render.yaml)
          eval "$start" &
          for i in $(seq 60); do curl -fs localhost:$PORT/healthz >/dev/null && break; sleep 1; done
          for path in / "/?q=glp-1" /zipf /zipf.png /embedding "/embedding?word=semaglutide" \
                      /embedding/projections.png "/vsm?query=pancreatic+cancer+risk" /vsm/metrics.png; do
            curl -fsS -o /dev/null -w "%{http_code} %{time_total}s $path\n" "localhost:$PORT$path"
          done
      - name: Serve with Render's default start command for a hand-made web service
        env:
          PORT: 8001
        run: |
          gunicorn app:app &
          for i in $(seq 60); do curl -fs localhost:$PORT/healthz >/dev/null && break; sleep 1; done
          curl -fsS -o /dev/null -w "%{http_code} /\n" localhost:$PORT/
