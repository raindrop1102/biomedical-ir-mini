name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # nltk: test-only Porter reference. numpy / matplotlib / flask: the optional embed, plot and web parts,
      # installed so their tests run instead of being skipped. Search and Zipf statistics need none of them.
      - run: python -m pip install nltk==3.9.1 numpy matplotlib flask
      - run: python -m unittest discover tests -v
